plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kami.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kami.app"
        minSdk 24
        targetSdk 34
        versionCode 18
        versionName "2.5.0"
    }

    signingConfigs {
        release {
            storeFile file("keystore.p12")
            storeType "PKCS12"
            storePassword "kami20130401"
            keyAlias "kami"
            keyPassword "kami20130401"
            // minSdk 24 后 AGP 默认只签 v2，但取签名指纹的逻辑在部分 ROM 上仍走 v1，
            // 必须同时启用 v1，否则完整性校验会失败。
            enableV1Signing true
            enableV2Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    // Shizuku：用户态特权框架，通过 ADB 或 root 启动的后台服务代执行高权限操作
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
